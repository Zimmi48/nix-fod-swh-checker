[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nix-fod-swh-checker"
version = "0.1.0"
description = "List the fixed-output derivations (FODs) reachable from a Nix attribute and check whether their sources are already archived on Software Heritage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nix-ecosystem" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nix-fod-swh-check = "nix_fod_swh_checker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nix_fod_swh_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
