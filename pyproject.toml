[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nix-archive-src"
version = "0.1.0"
description = "Check whether Nix sources are archived on Software Heritage and generate alternative derivations using those archives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nix-ecosystem" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nix-archive-src = "nix_archive_src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nix_archive_src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
