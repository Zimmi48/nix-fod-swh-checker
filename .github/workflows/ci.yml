name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v13
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Run flake checks
        run: nix flake check

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v13
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Run a live SWH API smoke test
        env:
          SWH_API_TOKEN: ${{ secrets.SWH_API_TOKEN }}
        run: |
          nix run .#nix-fod-swh-check -- check nixpkgs#hello \
            --no-checkpoint \
            --swh-api-token "$SWH_API_TOKEN" \
            --swh-identify-timeout 10 \
            --disarchive-timeout 10
          nix run .#nix-fod-swh-check -- generate-swh-fods nixpkgs#hello \
            -o swh-backed-fods.nix
          nix run .#nix-fod-swh-check -- cook-swh-fods nixpkgs#hello
          set +e
          output=$(nix run .#nix-fod-swh-check -- build-swh-fods swh-backed-fods.nix \
            --no-substitute 2>&1)
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if echo "$output" | grep -q "not cooked"; then
              echo "build-swh-fods failed with the expected vault-not-cooked error"
            else
              echo "build-swh-fods failed unexpectedly:"
              echo "$output"
              exit 1
            fi
          fi
