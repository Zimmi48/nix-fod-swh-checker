name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v13
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Run flake checks
        run: nix flake check

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v13
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Run a live SWH API smoke test
        env:
          SWH_API_TOKEN: ${{ secrets.SWH_API_TOKEN }}
        run: |
          nix run .#nix-fod-swh-check -- check nixpkgs#hello \
            --no-checkpoint \
            --swh-api-token "$SWH_API_TOKEN" \
            --swh-identify-timeout 10 \
            --disarchive-timeout 10
