name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-implementation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: upstream
          - name: lix
          - name: determinate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install upstream Nix
        if: matrix.name == 'upstream'
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Install Lix
        if: matrix.name == 'lix'
        uses: samueldr/lix-gha-installer-action@latest
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Install Determinate Nix
        if: matrix.name == 'determinate'
        uses: DeterminateSystems/nix-installer-action@v13
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Run cross-implementation FOD parsing tests
        run: |
          nix develop --command pytest -q tests/test_nix_implementations.py
        env:
          NIX_BINARY: nix

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v13
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Run flake checks
        run: nix flake check

      - name: Check FODs against Software Heritage
        env:
          SWH_API_TOKEN: ${{ secrets.SWH_API_TOKEN }}
        run: |
          nix run .#nix-fod-swh-check -- check .#hello \
            -o check-results.json \
            --no-checkpoint \
            --unpack-timeout 10 \
            --swh-identify-timeout 10 \
            --disarchive-timeout 10

      - name: Re-check FODs reusing the shared cache
        run: |
          start=$(date +%s)
          nix run .#nix-fod-swh-check -- check .#hello \
            --no-checkpoint \
            --unpack-timeout 10 \
            --swh-identify-timeout 10 \
            --disarchive-timeout 10
          end=$(date +%s)
          elapsed=$((end - start))
          echo "Re-check completed in ${elapsed}s"
          if [ "$elapsed" -gt 10 ]; then
            echo "Re-check took too long; cache may not be reused as expected"
            exit 1
          fi

      - name: Request archiving of unknown FOD origins (dry run)
        run: |
          nix run .#nix-fod-swh-check -- request-archiving \
            -i check-results.json \
            --dry-run

      - name: Request archiving of unknown FOD origins (real run)
        env:
          SWH_API_TOKEN: ${{ secrets.SWH_API_TOKEN }}
        run: |
          nix run .#nix-fod-swh-check -- request-archiving \
            -i check-results.json

      - name: Generate SWH-backed FODs expression
        run: |
          nix run .#nix-fod-swh-check -- generate-swh-fods \
            -i check-results.json \
            -o swh-backed-fods.nix

      - name: Request cooking of SWH vault flat archives
        env:
          SWH_API_TOKEN: ${{ secrets.SWH_API_TOKEN }}
        run: |
          nix run .#nix-fod-swh-check -- cook-swh-fods swh-backed-fods.nix

      - name: Upload SWH-backed FODs expression
        uses: actions/upload-artifact@v4
        with:
          name: swh-backed-fods
          path: swh-backed-fods.nix

  build-swh-fods:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v13
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Download SWH-backed FODs expression
        uses: actions/download-artifact@v4
        with:
          name: swh-backed-fods

      - name: Pre-populate nixpkgs cache
        run: |
          nix build .#cache-warmer

      - name: Build SWH-backed FODs
        env:
          SWH_API_TOKEN: ${{ secrets.SWH_API_TOKEN }}
        run: |
          nix run .#nix-fod-swh-check -- build-swh-fods swh-backed-fods.nix \
            --no-substitute
